name: Atualizar pontuação

on:
  schedule:
    - cron: "*/20 * * * *"   # a cada 20 minutos (horário UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na mão
  push:
    branches: [main]
    paths-ignore: [data.json]

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar dados do Cartola
        run: python scripts/update.py

      - name: Salvar data.json
        run: |
          if git diff --quiet data.json; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "camp-cartola-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "Atualiza pontuação"
          git push
